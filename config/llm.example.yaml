# Local models. Every endpoint is OpenAI-compatible (Ollama, LM Studio, llama.cpp, vLLM).
endpoints:
  - id: gpu-small
    machine: gpu
    url: http://gpu:11434/v1        # base URL including /v1
    model: qwen2.5:7b-instruct-q4_K_M
    ctx: 32768
    max_vram_gb: 8
  - id: mac-large
    machine: macbook
    url: http://macbook:1234/v1     # LM Studio default port
    model: qwen2.5-14b-instruct     # 24 GB RAM: ~14B; 32 GB: up to ~30B (open question §10)
    ctx: 65536
    requires_ac: true               # auto routing skips the Mac on battery, and never wakes it

# endpoint="auto" tries these in order and skips: down, context too small, requires_ac on battery.
# Endpoints that are not listed here can still be called by id.
routing:
  order: [gpu-small, mac-large]

# Local agents (open question §10: framework and trigger). Either:
#   url: POST {"task": "...", "job_id": "..."}; the response body is the result
#   cmd: shell command on the machine; the task arrives on stdin, stdout is the result
agents:
  - id: summarizer
    machine: gpu
    url: http://gpu:8000/run
  - id: aider-draft
    machine: hub
    cmd: cd ~/projects/scratch && aider --yes --message "$(cat)"
    timeout_s: 900
